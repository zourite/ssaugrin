<div class="flex">
{{ range $.Scratch.Get "books"}}
<div class="p-2 ">
  <div class="card">
    <div class="h-64 overflow-hidden">
      <a href="{{ .amazon }}" target="_blank">

        {{ partial "image.html" (dict
          "src" .image
          "alt" .titre
          "title" .titre
          "style" "width: 100%; height: auto"
          "max" 400
          "sizes" "(min-width: 768px) 220px, 45vw") }}
      </a>
    </div>

    <div class="btn-trello">
      <a href="{{ .trello }}" target="_blank">Voir la fiche 📚</a>
    </div>
  </div>
</div>
{{ end }}
</div>
